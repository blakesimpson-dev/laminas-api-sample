services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    nginx:
        image: nginx:1.29-alpine
        ports:
            - "8000:80"
        volumes:
            - .:/app:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        build: docker/php
        volumes:
            - .:/app
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    swagger-ui:
        image: swaggerapi/swagger-ui
        environment:
            SWAGGER_JSON: /spec/openapi.json
            BASE_URL: /docs
        volumes:
            - ./docs:/spec:ro


volumes:
    postgres_data:
